<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b1e"><meta name="color-scheme" content="dark"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>Tamaki Shion</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0b1e;--pn:#171431;--pn2:#1f1b40;--ln:#2c2757;--tx:#ece6f6;--mu:#9a94c2;--ac:#ffae5c;--te:#5fd9cf;--eu:#2b2457;--ela:#1a1736;--er:#ff7a8a;
  color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%}
*{box-sizing:inherit}
html{height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.5 Nunito,system-ui,sans-serif;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--te);font-weight:700}
:focus-visible{outline:2px solid var(--te);outline-offset:2px}
.hide{display:none!important}

/* ---------- conversa ---------- */
#app{height:100%;display:flex;flex-direction:column;max-width:820px;margin:0 auto;border-left:1px solid var(--ln);border-right:1px solid var(--ln)}
header.top{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--pn);border-bottom:1px solid var(--ln)}
.quem{display:flex;align-items:center;gap:12px;flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.av{width:46px;height:46px;border-radius:50%;padding:2px;background:conic-gradient(from 200deg,var(--ac),var(--te),var(--ac));flex:none}
.av img,.av span{width:100%;height:100%;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:var(--pn2);font-size:22px;border:2px solid var(--pn)}
.quem b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quem small{display:block;color:var(--mu);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quem small.dig{color:var(--te)}
.ic{background:none;border:0;width:42px;height:42px;border-radius:50%;font-size:20px;color:var(--mu);flex:none}
.ic:active{background:var(--pn2)}

#lista{flex:1;overflow-y:auto;padding:14px 12px 8px;background:radial-gradient(circle at 20% 0%,rgba(95,217,207,.07),transparent 40%),radial-gradient(circle at 90% 100%,rgba(255,174,92,.07),transparent 45%),var(--bg)}
.dia{text-align:center;margin:14px 0 10px}
.dia span{background:var(--pn);border:1px solid var(--ln);color:var(--mu);font-size:13px;padding:3px 12px;border-radius:20px}
.msg{max-width:min(86%,520px);margin:4px 0 8px;padding:8px 11px 6px;border-radius:14px;position:relative;word-wrap:break-word}
.msg.eu{margin-left:auto;background:var(--eu);border-bottom-right-radius:4px}
.msg.ela{background:var(--ela);border:1px solid var(--ln);border-bottom-left-radius:4px}
.msg p{margin:0 0 4px;white-space:pre-wrap}
.cap{display:block;font-size:13px;font-weight:800;color:var(--mu);margin-bottom:3px}
.ela .cap{color:var(--te)}
.hora{display:block;text-align:right;font-size:12px;color:var(--mu);margin-top:2px}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.thumbs img{width:110px;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--ln)}
.msg.diario{background:#2a2346;border:1px dashed #6b5fa8}
.coment{border-left:3px solid var(--ac);padding:2px 0 2px 10px;margin:6px 0}
.conf{background:rgba(255,174,92,.12);border:1px solid rgba(255,174,92,.5);border-radius:8px;padding:6px 9px;font-size:14px;margin:6px 0}
.erro{border-color:var(--er)!important}
.erro .cap{color:var(--er)}

/* o post é a peça principal: uma polaroid ainda sem foto */
.pola{max-width:300px;background:#f4efe6;color:#2a2140;border-radius:6px;padding:10px 10px 12px;margin:8px 0 6px;transform:rotate(-.6deg);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.pola .foto{aspect-ratio:4/5;border-radius:3px;overflow:hidden;background:repeating-linear-gradient(135deg,#ddd3c2 0 12px,#e8dfd0 12px 24px);display:grid;place-items:center;text-align:center;padding:16px;font-size:15px;color:#5b4d70}
.pola .foto img{width:100%;height:100%;object-fit:cover}
.pola .leg{margin:10px 2px 0;white-space:pre-wrap;font-size:15px;line-height:1.45}
.pola .tags{margin:6px 2px 0;color:#2f7f78;font-size:14px;font-weight:700;word-break:break-word}
.estado{display:inline-block;font-size:12px;font-weight:800;padding:2px 9px;border-radius:20px;margin-top:4px}
.estado.rasc{background:rgba(95,217,207,.15);color:var(--te)}
.estado.feito{background:rgba(255,174,92,.18);color:var(--ac)}
.acoes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bt{background:var(--pn2);border:1px solid var(--ln);border-radius:20px;padding:7px 12px;font-size:14px;font-weight:700}
.bt.p{background:var(--ac);border-color:var(--ac);color:#1b1230}
.bt:active{filter:brightness(1.2)}
.pensando{display:inline-flex;gap:4px;padding:12px 14px}
.pensando i{width:7px;height:7px;border-radius:50%;background:var(--mu);animation:pul 1.2s infinite}
.pensando i:nth-child(2){animation-delay:.2s}.pensando i:nth-child(3){animation-delay:.4s}
@keyframes pul{0%,60%,100%{opacity:.3}30%{opacity:1}}
.vazio{text-align:center;color:var(--mu);padding:30px 20px}
.vazio b{color:var(--tx);display:block;font-size:18px;margin-bottom:6px}

/* barra de baixo */
footer.bar{background:var(--pn);border-top:1px solid var(--ln);padding:8px 10px 10px}
.modos{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.modo{white-space:nowrap;background:transparent;border:1px solid var(--ln);border-radius:20px;padding:6px 11px;font-weight:700;font-size:14px;color:var(--mu)}
.modo.on{background:var(--te);border-color:var(--te);color:#0d1f1e}
.pend{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pend div{position:relative}
.pend img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.pend button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--er);color:#fff;font-size:14px;line-height:1}
.entra{display:flex;align-items:flex-end;gap:8px}
.entra textarea{flex:1;min-height:46px;max-height:140px;resize:none;background:var(--bg);border:1px solid var(--ln);border-radius:22px;padding:11px 16px;field-sizing:content}
.env{width:46px;height:46px;border-radius:50%;border:0;background:var(--ac);color:#1b1230;font-size:20px;flex:none}
.env:disabled{opacity:.5}
.dica{font-size:13px;color:var(--mu);margin:6px 4px 0}

/* ---------- páginas (perfil e o resto) ---------- */
.pg{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:10;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
.pg.anima{animation:entra .22s ease-out}
@keyframes entra{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.pg.anima{animation:none}.pensando i{animation:none;opacity:.7}}
.pg .in{max-width:760px;margin:0 auto;padding:0 16px}
.pg header{display:flex;align-items:center;gap:8px;padding:10px 4px;position:sticky;top:0;background:var(--bg);z-index:2;margin:0 -4px}
.pg header h2{margin:0;font-size:18px}
.capa{text-align:center;padding:10px 0 18px}
.capa .av{width:150px;height:150px;margin:0 auto 12px;padding:4px;position:relative}
.capa .av span{font-size:60px;border-width:4px;border-color:var(--bg)}
.capa .troca{position:absolute;right:4px;bottom:4px;width:40px;height:40px;border-radius:50%;background:var(--ac);color:#1b1230;border:3px solid var(--bg);font-size:17px}
.pg .campo{background:transparent;border:1px solid transparent;border-radius:8px;text-align:center;width:100%;padding:4px 8px}
.pg .campo:focus{border-color:var(--ln);background:var(--pn)}
.pg .campo.nome{font-size:24px;font-weight:800}
.pg .campo.rec{color:var(--mu)}
.atalhos{display:flex;gap:10px;justify-content:center;margin-top:12px}
.at{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:10px 14px;min-width:92px;font-size:14px;font-weight:700}
.at span{font-size:22px}
.sec{background:var(--pn);border:1px solid var(--ln);border-radius:12px;margin:12px 0;padding:14px}
.sec h3{margin:0 0 10px;font-size:15px;color:var(--mu);display:flex;justify-content:space-between;align-items:center}
.sec h3 button{background:none;border:0;color:var(--te);font-weight:800;font-size:14px}
.rede{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--ln);text-decoration:none;color:var(--tx);font-weight:400}
.rede:first-of-type{border-top:0}
.rede .e{font-size:22px;width:30px;text-align:center}
.rede small{display:block;color:var(--mu);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60vw}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.grade button{aspect-ratio:1;border:0;padding:0;background:var(--pn2);border-radius:4px;overflow:hidden;font-size:12px;color:var(--mu)}
.grade img{width:100%;height:100%;object-fit:cover}
.linha{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-top:1px solid var(--ln);padding:13px 2px;text-align:left}
.linha:first-of-type{border-top:0}
.linha .e{font-size:22px;width:30px;text-align:center}
.linha small{display:block;color:var(--mu);font-size:13px}
.mini{display:flex;gap:12px;align-items:flex-start}
.mini .pola{width:130px;flex:none;padding:6px 6px 8px;margin:0}
.mini .pola .foto{padding:6px;font-size:11px}
.lbl{display:block;font-weight:800;font-size:14px;color:var(--mu);margin:12px 0 4px}
.lbl small{font-weight:400}
.pg :where(input:not([type=checkbox]):not([type=radio]),textarea,select),.sh :where(textarea,input:not([type=checkbox]):not([type=radio])){background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:9px;width:100%}
.pg :where(textarea),.sh :where(textarea){field-sizing:content;min-height:46px;resize:vertical}
option{background:#171431}
.ab{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:14px;color:var(--mu);margin-top:10px}
.ab input[type=checkbox]{width:auto}
.b,.g{border-radius:8px;padding:9px 14px;font-weight:800;display:inline-block;font-size:15px}
.b{background:var(--ac);color:#1b1230;border:0}
.g{background:none;border:1px solid var(--ln)}
.m{color:var(--mu);font-size:14px;margin:6px 0 0}
.opc{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--ln);border-radius:10px;padding:12px;margin:8px 0}
.opc input{width:auto;margin-top:5px}
.opc.on{border-color:var(--te);background:rgba(95,217,207,.06)}

/* cartão de personalidade: no formato de cartão, como o da voz */
.cartao{border-radius:16px;padding:16px;background:linear-gradient(135deg,#2b1f52,#17133a 55%,#173a40);border:1px solid #4a3f86;display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:center;margin:6px 0 4px}
.cartao .av{width:88px;height:88px}
.cartao .av span{font-size:40px}
.cartao b{font-size:20px;display:block}
.cartao p{margin:4px 0 0;font-size:14px;color:#d6cff0}
.cartao .chip{display:inline-block;margin-top:8px;font-size:13px;font-weight:800;background:rgba(0,0,0,.3);border:1px solid #4a3f86;border-radius:20px;padding:2px 10px}

/* ficha antiga */
nav.fn{display:flex;gap:6px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}
nav.fn button{white-space:nowrap;background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:8px 12px;font-weight:700}
nav.fn button.on{background:var(--ac);border-color:var(--ac);color:#1b1230}
.c{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:14px;margin:12px 0}
.r{display:grid;grid-template-columns:1fr auto;gap:6px;margin-bottom:12px}
.r textarea,.r .f{grid-column:1/3}
.lb{font-weight:800;color:var(--mu);font-size:14px}
.ti{font-weight:800;font-size:18px;margin-bottom:12px}
.x{background:none;border:1px solid var(--ln);border-radius:6px;width:36px;color:var(--mu)}
.dlg{background:#06050f;border:4px double #fff;border-radius:4px;padding:14px;margin:12px 0}
.dlg textarea{border:0!important;color:#fff;font:13px/1.6 ui-monospace,Menlo,monospace;min-height:300px;margin-top:10px;padding:0!important}
.doc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;border-top:1px solid var(--ln);padding:12px 0}
.doc:first-of-type{border-top:0}
.doc .ic2{font-size:1.8rem}
.doc b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.doc .ab{grid-column:1/3}
.doc pre{grid-column:1/3;white-space:pre-wrap;max-height:260px;overflow:auto;background:#06050f;border-radius:8px;padding:10px;font:13px/1.5 ui-monospace,monospace;margin:0}
.aviso{border-color:var(--ac)}


/* estúdio de imagem */
.selo{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.selo i{width:10px;height:10px;border-radius:50%;background:var(--mu)}
.selo.bom i{background:#6fe39a}.selo.vai i{background:var(--ac);animation:pul 1.2s infinite}.selo.mal i{background:var(--er)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip2{background:transparent;border:1px solid var(--ln);border-radius:20px;padding:7px 13px;font-weight:700;font-size:14px;color:var(--mu)}
.chip2.on{background:var(--te);border-color:var(--te);color:#0d1f1e}
.final{font:13px/1.5 ui-monospace,Menlo,monospace;color:var(--mu);background:var(--bg);border-radius:8px;padding:8px;margin-top:6px;word-break:break-word}
.gerar{width:100%;padding:14px;font-size:17px;border-radius:12px;margin-top:4px}
.gerar:disabled{opacity:.55}
.barra{height:8px;border-radius:4px;background:var(--bg);overflow:hidden;margin-top:10px}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--te),var(--ac));transition:width .3s}
.res{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.res.hist{grid-template-columns:repeat(3,1fr);gap:4px}
.res button{border:0;padding:0;background:var(--pn2);border-radius:8px;overflow:hidden;aspect-ratio:4/5}
.res.hist button{border-radius:4px;aspect-ratio:1}
.res img{width:100%;height:100%;object-fit:cover;display:block}
.vista{width:100%;border-radius:10px;display:block;margin-bottom:8px}
details summary{cursor:pointer;font-weight:800;color:var(--mu);padding:4px 0}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input[type=range]{width:100%;accent-color:var(--te)}

/* folha que sobe de baixo */
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--pn);border:1px solid var(--ln);border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:88%;overflow-y:auto;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sh .puxa{width:44px;height:5px;border-radius:3px;background:var(--ln);margin:4px auto 10px}
.sh h3{margin:0 0 8px}
.sh .linha{padding:12px 2px}
.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#06050f;border:1px solid var(--ln);border-radius:10px;padding:10px 16px;z-index:30;max-width:90%;text-align:center;font-size:15px}
</style></head><body>
<div id="app">
  <header class="top">
    <button class="quem" id="abrePerfil" aria-label="Ver o perfil da Tamaki"><div class="av" id="avTop"></div><div style="min-width:0"><b id="nomeTop">Tamaki Shion</b><small id="recTop"></small></div></button>
    <button class="ic" id="menuTop" aria-label="Mais opções">⋮</button>
  </header>
  <div id="lista" aria-live="polite"></div>
  <footer class="bar">
    <div class="modos" id="modos" role="tablist" aria-label="O que a mensagem vai ser"></div>
    <div class="pend" id="pend"></div>
    <div class="entra">
      <button class="ic" id="anexa" aria-label="Anexar print ou imagem">📎</button>
      <textarea id="txt" rows="1" aria-label="Mensagem"></textarea>
      <button class="env" id="envia" aria-label="Enviar">➤</button>
    </div>
    <p class="dica" id="dica"></p>
  </footer>
</div>
<div id="pgs"></div><div id="shs"></div>
<input type="file" id="fAnexo" accept="image/*" multiple hidden>
<input type="file" id="fImg" accept="image/*" hidden>
<input type="file" id="fFoto" accept="image/*" hidden>
<script>
/* =========================================================
   Tamaki Shion: conversa, perfil, cartão e ficha.
   A ficha continua em localStorage "tamaki" (a Central e a Escrita leem daqui).
   A conversa, o diário, as notícias e os posts ficam no IndexedDB "tamaki-zap".
   ========================================================= */

// Ficha resumida (versão 2) + cartão de personalidade + perfil
const CARTAO={id:'cartao',t:'Cartão de personalidade',inc:1,f:[
 ['Essência','Elfa de 25 anos, caótica neutra, fofoqueira e dramática. Vive o dia a dia entre livros, games e a galinha de pelúcia.','ess'],
 ['Jeito de falar','Papo de call, português brasileiro bem informal, gírias da comunidade LGBTQIAP+ (pajubá). Chama quem acompanha de “miga” e “migo”. Frases curtas, exagera nas reações.','fala'],
 ['Bordões','“Bicha, nem te conto”, “gente”, “tintim por tintim”, “nem relógio trabalha de graça”, “não vou dar palco pra maluco”.','bord'],
 ['Nunca faz','Palavrão sem suavizar; inventar fatos sobre gente real; discurso de ódio; fingir que não é uma personagem feita com IA.','nunca'],
 ['Exemplos de fala','Bicha, nem te conto: dobrei a página 42 DE NOVO e a galinha me olhou com julgamento.\nMiga, eu não vou dar palco pra maluco… mas eu vou comentar, né? Sou humana. Quer dizer, elfa.\nGente, dormi às 4 por causa de UMA batalha de ginásio. Valeu cada olheira.','ex'],
 ['Aparência (para imagens, em inglês)','Tamaki Shion, a 25-year-old elf woman, warm brown skin, curly blue-violet hair with one orange streak, teal eyes, pointed elf ears, small fangs','apar'],
 ['Estilo das imagens (em inglês)','warm cartoon illustration, flat colors, clean lineart, cozy soft lighting','estilo'],
 ['Palavra-gatilho do LoRA','','lora'],
 ['Marca de IA nos posts','#personagemIA #feitocomIA','marca'],
 ['Voz ligada','','voz']]};
const PERFIL={nome:'Tamaki Shion',recado:'lendo, jogando ou fofocando',sobre:'Elfa, 25 anos, leitora de livros que não existem. Personagem criada com IA.',foto:'',vozId:'',
 redes:[{e:'📸',n:'Instagram',u:''},{e:'▶️',n:'YouTube',u:''},{e:'🎵',n:'TikTok',u:''}]};
const D={v:2,mods:[
{id:'perfil',t:'Perfil',inc:1,f:[['Quem é','Tamaki Shion, elfa de 25 anos.'],['Aparência','Pele morena, cabelo cacheado azul-arroxeado com mecha laranja, olhos verde-água, orelhas de elfa e presinhas.'],['Roupa','Moletom preto e calça cargo bege. Visual de protagonista: a definir (transformação no Ep. 1).'],['Companheiros','Galinha de pelúcia (conversa com ela) e gato preto de pelúcia.'],['Manias','Dobra as páginas dos livros, enrola a mecha quando se distrai, dorme mal por causa dos jogos.'],['Gostos','Ler, videogames, Pokémon FireRed.'],['Aviso','Personagem criada com IA, explícito no perfil.']]},
{id:'pers',t:'Personalidade',inc:1,f:[['Jeito de falar','Primeira pessoa, papo de call com o público, português brasileiro informal.'],['Temperamento','Fofoqueira, dramática, sarcástica e competitiva (“não vou dar palco pra maluco”).'],['Afetos e rival','Ama a mãe e o Bobasauro. Rival: Gary, o “moleque mimado de apartamento”.'],['Bordões','“gente”, “amiga”, “tintim por tintim”, “nem relógio trabalha de graça”. Despedida: “Nos vemos no próximo sábado! Beijão!”'],['Regras','Palavrões sempre suavizados (YouTube). Frase de assinatura: a definir.']]},

 if(CER.modo=='manual')return manual(sis,junta);
 if(CER.modo=='gemini'){if(!CER.chave)throw new Error('falta a chave do Gemini (Perfil › Cérebro)');
  const contents=[];for(const m of junta){const parts=[{text:m.text||'.'}];for(const im of m.imgs||[]){const d=await b64(im);parts.push({inline_data:{mime_type:im.type||'image/jpeg',data:d.split(',')[1]}})}contents.push({role:m.role=='user'?'user':'model',parts})}
  const body={systemInstruction:{parts:[{text:sis}]},contents,generationConfig:{temperature:1}};if(json)body.generationConfig.responseMimeType='application/json';
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(CER.modelo||'gemini-2.5-flash')+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':CER.chave},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const m=(j.error&&j.error.message)||('erro '+r.status);if(r.status==429)throw new Error('o limite grátis do Gemini acabou por agora; espere um pouco ou amanhã');if(r.status==404)throw new Error('o modelo “'+CER.modelo+'” não existe mais; troque em Perfil › Cérebro');if(r.status==400||r.status==403)throw new Error('o Gemini recusou: '+m);throw new Error(m)}
  const t=((j.candidates||[])[0]?.content?.parts||[]).map(p=>p.text||'').join('').trim();if(!t)throw new Error('o Gemini respondeu vazio (às vezes ele bloqueia algum assunto)');return t}
 if(CER.modo=='proprio'){if(!CER.url)throw new Error('falta o endereço do seu modelo (Perfil › Cérebro)');
  const messages=[{role:'system',content:sis}];for(const m of junta){if(m.imgs&&m.imgs.length){const c=[{type:'text',text:m.text||'.'}];for(const im of m.imgs)c.push({type:'image_url',image_url:{url:await b64(im)}});messages.push({role:m.role,content:c})}else messages.push({role:m.role,content:m.text})}
  let u=CER.url.trim().replace(/\/+$/,'');if(!/\/chat\/completions$/.test(u))u+=(/\/v1$/.test(u)?'':'/v1')+'/chat/completions';
  const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:CER.mProprio||'tamaki',messages,temperature:.9})}).catch(()=>{throw new Error('não achei o seu modelo nesse endereço; o notebook do Kaggle ou o Termux está ligado?')});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error((j.error&&(j.error.message||j.error))||('erro '+r.status));
  const t=(((j.choices||[])[0]||{}).message||{}).content;if(!t)throw new Error('o seu modelo respondeu vazio');return String(t).trim()}
}

 if(modo=='diario'||modo=='conversa'){if(!texto&&!imgs.length)return toast(modo=='diario'?'Escreva o que aconteceu':'Escreva uma mensagem')}
 if(modo=='noticia'&&!imgs.length&&!texto)return toast('Anexe o print da notícia com 📎');
 const m={id:uid(),t:Date.now(),de:'eu',tipo:modo,texto,imgs};
 $('#txt').value='';pend=[];desenhaPend();await guarda(m);
 const qual=modo;if(modo!='conversa'){modo='conversa';desenhaModos()}
 if(qual=='diario'){desenhaChat();return toast('Guardado no diário dela')}
 responder(m)}

async function responder(pedido,refazId){ocupada=true;topo();desenhaChat();
 try{let r;const sis=quemE()+contexto();
  if(pedido.tipo=='conversa'){const hist=msgs.filter(x=>x.tipo=='conversa'&&x.id!=pedido.id&&x.t<=pedido.t).slice(-14).map(x=>({role:x.de=='eu'?'user':'assistant',text:x.texto||'(imagem)',imgs:[]}));
   const t=await pensar(sis+'\n## Como responder\nIsto é uma conversa de mensagens com o Tama, quem cria você. Responda curto (1 a 4 frases), sem narrar ações entre asteriscos.',[...hist,{role:'user',text:pedido.texto||'(mandei uma imagem)',imgs:pedido.imgs}]);
   r={tipo:'conversa',texto:t}}
  else if(pedido.tipo=='noticia'){const t=await pensar(sis,[{role:'user',text:'Te mandei '+(pedido.imgs.length?(pedido.imgs.length==1?'o print':'os prints')+' de uma notícia':'uma notícia')+'.'+(pedido.texto?' Recado: '+pedido.texto:'')+'\nLeia e responda SÓ com um JSON, sem nada antes ou depois:\n{"titulo":"título curto","resumo":"2 a 4 frases só com os fatos, sem opinião","comentario":"o que você acha, do seu jeito, 1 a 3 frases","conferir":"deixe vazio se parecer confiável; se parecer boato, notícia antiga ou sem fonte, diga o que conferir"}\nSe não der para ler, diga isso no resumo.',imgs:pedido.imgs}],true);
   const d=pegaJSON(t);r={tipo:'noticia',dados:{titulo:String(d.titulo||''),resumo:String(d.resumo||''),comentario:String(d.comentario||''),conferir:String(d.conferir||'')}}}
  else if(pedido.tipo=='post'){const t=await pensar(sis,[{role:'user',text:'Hora de decidir o seu próximo post no Instagram. Quem escolhe é você: o que está fazendo, onde e com que roupa, combinando com o seu dia a dia, o seu diário, as notícias que leu e o dia de hoje. Não repita os posts recentes.'+(pedido.texto?'\nDica do Tama: '+pedido.texto:'')+'\nResponda SÓ com um JSON, sem nada antes ou depois:\n{"ideia":"o que você decidiu postar, 1 frase na sua voz","cena":"a foto descrita em português, 1 ou 2 frases","prompt_imagem":"in English: only the scene — action, place, outfit of the day, props, pose, camera framing, lighting. Do NOT describe her face, hair, skin or ears (the app adds that)","legenda":"a legenda na sua voz, 1 a 5 linhas, pode ter emoji","hashtags":["de 5 a 10 hashtags, sem as de IA"]}',imgs:[]}],true);
   const d=pegaJSON(t);r={tipo:'post',dados:{ideia:String(d.ideia||''),cena:String(d.cena||''),prompt_imagem:String(d.prompt_imagem||''),legenda:String(d.legenda||''),hashtags:(Array.isArray(d.hashtags)?d.hashtags:String(d.hashtags||'').split(/\s+/)).map(x=>String(x).trim()).filter(Boolean).map(x=>x[0]=='#'?x:'#'+x),status:'rascunho'}}}
  if(refazId){try{await ZAP.tirar(refazId)}catch(e){}msgs=msgs.filter(x=>x.id!=refazId)}
  await guarda(Object.assign({id:uid(),t:Date.now(),de:'ela',pedido:pedido.id,estrela:0},r))}
 catch(e){if(e.message!='cancelado'){const er={id:refazId||uid(),t:Date.now(),de:'ela',tipo:'erro',texto:e.message,pedido:pedido.id};msgs=msgs.filter(x=>x.id!=er.id);msgs.push(er)}else if(refazId){}}
 finally{ocupada=false;topo();desenhaChat();desenhaPerfilSeAberto()}}

let alvoFoto=null;
$('#lista').onclick=async e=>{const b=e.target.closest('[data-a]');
 if(b){e.stopPropagation();const m=msgs.find(x=>x.id==b.dataset.id);if(!m)return;const a=b.dataset.a;
  if(a=='cpimg')cp(promptImg(m.dados));if(a=='cppost')cp(textoPost(m.dados));if(a=='foto'){alvoFoto=m.id;$('#fImg').click()}if(a=='postei')marcaPostado(m);
  if(a=='refaz'){const p=msgs.find(x=>x.id==m.pedido);if(p)responder(p,m.id)}if(a=='gerar')abreEstudio(m.id);return}
 const el=e.target.closest('.msg[data-id]');if(el)acoesMsg(el.dataset.id)};
$('#fImg').onchange=async e=>{const f=e.target.files[0];e.target.value='';const m=msgs.find(x=>x.id==alvoFoto);if(!f||!m)return;try{m.img=await reduz(f,1440,.9);await guarda(m);desenhaChat(false);desenhaPerfilSeAberto();toast('Imagem no post')}catch(x){toast('Não consegui abrir a imagem')}};
async function marcaPostado(m){m.dados.status='postado';m.dados.postadoEm=Date.now();await guarda(m);desenhaChat(false);desenhaPerfilSeAberto();
 const ig=S.perfil.redes.find(r=>/insta/i.test(r.n)&&/^https?:/.test(r.u));toast(ig?'Marcado como postado':'Marcado como postado. Ponha o link do Instagram no perfil para abrir de lá')}

function acoesMsg(id){const m=msgs.find(x=>x.id==id);if(!m||m.tipo=='erro')return;const ela=m.de=='ela',ed=m.tipo=='conversa'||m.tipo=='diario'||(ela&&(m.tipo=='noticia'||m.tipo=='post'));
 const sh=folha(`${ela?`<button class="linha" data-x="estrela"><span class="e">⭐</span><span>${m.estrela?'Tirar do material de treino':'É a cara dela'}<small>${m.estrela?'Deixa de entrar no treino.':'Entra no material para treinar a IA dela no Kaggle.'}</small></span></button>`:''}
  ${ed?`<button class="linha" data-x="edita"><span class="e">✏️</span><span>Editar${ela?'<small>Corrija antes de marcar ⭐: o treino aprende com o que estiver aqui.</small>':''}</span></button>`:''}
  ${ela&&m.tipo=='post'?`<button class="linha" data-x="outra"><span class="e">🔁</span><span>Pedir outra ideia</span></button>`:''}
  ${ela&&m.tipo=='post'&&m.dados.status=='postado'?`<button class="linha" data-x="desposta"><span class="e">↩️</span><span>Voltar para rascunho</span></button>`:''}
  <button class="linha" data-x="copia"><span class="e">📋</span><span>Copiar texto</span></button>
  <button class="linha" data-x="apaga"><span class="e">🗑</span><span>Apagar</span></button>`);
 sh.onclick=async e=>{const b=e.target.closest('[data-x]');if(!b)return;const x=b.dataset.x;
  if(x=='estrela'){m.estrela=m.estrela?0:1;await guarda(m);fecha();desenhaChat(false);toast(m.estrela?'Guardado para o treino':'Tirado do treino')}
  if(x=='copia'){cp(m.tipo=='post'&&ela?textoPost(m.dados):m.tipo=='noticia'&&ela?m.dados.titulo+'\n'+m.dados.resumo+'\n\n'+m.dados.comentario:m.texto||'');fecha()}
  if(x=='outra'){fecha();const p=msgs.find(y=>y.id==m.pedido)||{id:uid(),t:Date.now(),tipo:'post',texto:'',imgs:[]};responder(Object.assign({},p,{texto:(p.texto?p.texto+'. ':'')+'Quero outra ideia, diferente de: '+m.dados.ideia}))}
  if(x=='desposta'){m.dados.status='rascunho';delete m.dados.postadoEm;await guarda(m);fecha();desenhaChat(false)}
  if(x=='apaga'){if(!b.dataset.s){b.dataset.s=1;b.querySelector('span:last-child').textContent='Toque de novo para apagar';return}await ZAP.tirar(m.id);msgs=msgs.filter(y=>y.id!=m.id);fecha();desenhaChat(false);desenhaPerfilSeAberto()}
  if(x=='edita'){fecha();editaMsg(m)}}}
function editaMsg(m){let campos;
 if(m.tipo=='post'&&m.de=='ela')campos=[['ideia','O que ela decidiu'],['cena','A foto (português)'],['prompt_imagem','Cena para a imagem (inglês)'],['legenda','Legenda'],['hashtags','Hashtags']];
 else if(m.tipo=='noticia'&&m.de=='ela')campos=[['titulo','Título'],['resumo','Resumo'],['comentario','Comentário dela'],['conferir','O que conferir']];
 else campos=[['texto','Texto']];
 const val=k=>k=='texto'?m.texto:k=='hashtags'?m.dados.hashtags.join(' '):m.dados[k];
 const sh=folha(`<h3>Editar</h3>${campos.map(([k,n])=>`<label class="lbl">${n}</label><textarea data-k="${k}">${esc(val(k))}</textarea>`).join('')}<div class="ab"><button class="b" id="eOk">Salvar</button><button class="g" id="eNo">Cancelar</button></div>`);
 sh.querySelector('#eNo').onclick=()=>fecha();
 sh.querySelector('#eOk').onclick=async()=>{sh.querySelectorAll('[data-k]').forEach(t=>{const k=t.dataset.k,v=t.value.trim();if(k=='texto')m.texto=v;else if(k=='hashtags')m.dados.hashtags=v.split(/\s+/).filter(Boolean).map(x=>x[0]=='#'?x:'#'+x);else m.dados[k]=v});await guarda(m);fecha();desenhaChat(false);if(pilha.length)desenhaPgs();toast('Salvo')}}

let aoFechar=null;
function folha(html,cancel){fecha();aoFechar=cancel||null;const f=document.createElement('div');f.className='fundo';f.innerHTML=`<div class="sh" role="dialog" aria-modal="true"><div class="puxa"></div>${html}</div>`;f.onclick=e=>{if(e.target==f)fecha()};$('#shs').appendChild(f);return f.querySelector('.sh')}
function fecha(semCancelar){const c=aoFechar;aoFechar=null;$('#shs').innerHTML='';if(c&&!semCancelar)c()}
let pilha=[],anim=false;
function abrePg(id){pilha.push(id);anim=true;desenhaPgs();if(id=='imagem'&&!K.url&&!K.procurando&&EST.codigo)kProcurar()}
function voltaPg(){pilha.pop();anim=false;desenhaPgs();if(!pilha.length)desenhaChat(false)}
function desenhaPgs(){const ant=$('#pgs .pg:last-of-type'),rol=ant&&!anim?{id:ant.dataset.pg,y:ant.scrollTop}:null;$('#pgs').innerHTML=pilha.map((id,i)=>`<section class="pg${anim&&i==pilha.length-1?' anima':''}" data-pg="${id}" style="z-index:${10+i}" aria-label="${esc(TIT[id]||'')}"><div class="in"><header><button class="ic" data-volta aria-label="Voltar">←</button><h2>${esc(TIT[id]||'')}</h2></header><div class="cx"></div></div></section>`).join('');
 pilha.forEach(id=>{const sec=$(`#pgs [data-pg="${id}"]`);sec.querySelector('[data-volta]').onclick=voltaPg;PG[id](sec.querySelector('.cx'))});
 document.querySelectorAll('#pgs .pg').forEach((s,i,a)=>s.style.display=i==a.length-1?'block':'none');const nv=$('#pgs .pg:last-of-type');if(rol&&nv&&nv.dataset.pg==rol.id)nv.scrollTop=rol.y;anim=false;topo()}
function desenhaPerfilSeAberto(){if(pilha.length&&pilha[pilha.length-1]=='perfil')desenhaPgs()}

// zip simples (sem compressão), igual ao da Central
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function zip(arqs){const enc=new TextEncoder(),partes=[],cent=[];let off=0;for(const a of arqs){const n=enc.encode(a.nome),c=crc32(a.dados),h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(8,0,true);h.setUint32(14,c,true);h.setUint32(18,a.dados.length,true);h.setUint32(22,a.dados.length,true);h.setUint16(26,n.length,true);partes.push(h.buffer,n,a.dados);
 const d=new DataView(new ArrayBuffer(46));d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);d.setUint32(16,c,true);d.setUint32(20,a.dados.length,true);d.setUint32(24,a.dados.length,true);d.setUint16(28,n.length,true);d.setUint32(42,off,true);cent.push(d.buffer,n);off+=30+n.length+a.dados.length}
 const tam=cent.reduce((s,x)=>s+(x.byteLength||x.length),0),f=new DataView(new ArrayBuffer(22));f.setUint32(0,0x06054b50,true);f.setUint16(8,arqs.length,true);f.setUint16(10,arqs.length,true);f.setUint32(12,tam,true);f.setUint32(16,off,true);return new Blob([...partes,...cent,f.buffer],{type:'application/zip'})}

async function gerarImgs(extra){if(gerando)return;const pr=promptFinal();if(!pr)return toast('Escreva o que desenhar');
 const f=FORMATOS[EST.formato],pedido=Object.assign({prompt:pr,negativo:EST.negativo,largura:f.w,altura:f.h,passos:EST.passos,cfg:EST.cfg,semente:EST.semente===''?-1:+EST.semente,quantidade:EST.qtd,lora:EST.lora,forca:EST.forca},extra||{});
 gerando=true;progresso={v:0,t:'Mandando o pedido…'};ultimas=[];redesenhaEst();
 try{const {id}=await kApi('/gerar',pedido);const ini=Date.now();
  while(true){await new Promise(r=>setTimeout(r,1500));const t=await kApi('/tarefa/'+encodeURIComponent(id));
   progresso={v:t.progresso||0,t:t.estado=='fila'?'Na fila…':t.estado=='gerando'?'Gerando '+Math.min((t.feitas||0)+1,t.total||pedido.quantidade)+' de '+(t.total||pedido.quantidade)+'…':''};barra();
   if(t.estado=='erro')throw new Error(t.erro||'o Kaggle não conseguiu gerar');
   if(t.estado=='pronto'){for(const im of t.imagens||[]){const blob=await deB64('data:image/png;base64,'+im.png);const r={id:uid(),t:Date.now(),blob,prompt:pr,cena:EST.prompt,negativo:pedido.negativo,semente:im.semente,lora:pedido.lora,forca:pedido.forca,largura:pedido.largura,altura:pedido.altura,post:alvoPost};await IMGS.por(r);historico.push(r);ultimas.push(r)}
    if(historico.length>80){const sobra=historico.splice(0,historico.length-80);for(const x of sobra)try{await IMGS.tirar(x.id)}catch(e){}}
    progresso={v:1,t:ultimas.length+(ultimas.length==1?' imagem pronta':' imagens prontas')};break}
   if(Date.now()-ini>8*60e3)throw new Error('demorou demais; o Kaggle pode ter caído')}}
 catch(e){progresso={v:0,t:'❌ '+e.message};if(!K.url){K.selo=['mal','Kaggle desligado']}}
 gerando=false;redesenhaEst()}

function verImg(id){const i=historico.find(x=>x.id==id);if(!i)return;const post=msgs.find(x=>x.id==(alvoPost||i.post))||msgs.filter(m=>m.de=='ela'&&m.tipo=='post'&&m.dados&&m.dados.status!='postado').slice(-1)[0];
 const sh=folha(`<img class="vista" src="${urlDe(i.blob)}" alt="Imagem gerada">
  <p class="m" style="margin:0 0 8px">Semente ${esc(i.semente)}${i.lora?' · '+esc(i.lora)+' '+i.forca:''} · ${i.largura}×${i.altura}</p>
  ${post?`<button class="linha" data-x="post"><span class="e">📸</span><span>Usar no post<small>${esc(post.dados.ideia.slice(0,70))}</small></span></button>`:''}
  <button class="linha" data-x="baixa"><span class="e">⬇</span>Baixar</button>
  <button class="linha" data-x="bib"><span class="e">📚</span>Mandar para a Biblioteca</button>
  <button class="linha" data-x="mesma"><span class="e">🎯</span><span>Gerar de novo com esta semente<small>Mude o texto e mantenha a composição parecida.</small></span></button>
  <button class="linha" data-x="copia"><span class="e">📋</span>Copiar o prompt</button>
  <button class="linha" data-x="apaga"><span class="e">🗑</span><span>Apagar</span></button>`);
 sh.onclick=async e=>{const b=e.target.closest('[data-x]');if(!b)return;const x=b.dataset.x;
  if(x=='post'){post.img=i.blob;await guarda(post);fecha();desenhaChat(false);toast('Imagem no post')}
  if(x=='baixa'){baixar(i.blob,'tamaki-'+new Date(i.t).toISOString().slice(0,10)+'-'+i.semente+'.png')}
  if(x=='bib'){try{await naBiblioteca(i);toast('Guardada na Biblioteca')}catch(er){toast('Não consegui guardar: '+er.message)}}
  if(x=='mesma'){EST.semente=String(i.semente);EST.qtd=1;salvaEst();fecha();desenhaPgs();toast('Semente '+i.semente+' fixada em Avançado')}
  if(x=='copia')cp(i.prompt);
  if(x=='apaga'){if(!b.dataset.s){b.dataset.s=1;b.querySelector('span:last-child').textContent='Toque de novo para apagar';return}await IMGS.tirar(i.id);historico=historico.filter(y=>y.id!=i.id);ultimas=ultimas.filter(y=>y.id!=i.id);fecha();desenhaPgs()}}}

// mesma Biblioteca da Central (IndexedDB "tamaki-biblioteca")
function naBiblioteca(i){return new Promise((ok,no)=>{const r=indexedDB.open('tamaki-biblioteca',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('itens'))r.result.createObjectStore('itens',{keyPath:'id'})};r.onerror=()=>no(r.error);
 r.onsuccess=()=>{const db=r.result,id='b'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),t=db.transaction('itens','readwrite');
  t.objectStore('itens').put({id,origem:'outro',tipo:'imagem',nome:'Tamaki · '+(i.cena||'imagem').slice(0,40),texto:i.prompt,mime:i.blob.type||'image/png',tamanho:i.blob.size,criado:Date.now(),blob:i.blob});
  t.oncomplete=()=>{db.close();try{const c=new BroadcastChannel('tamaki-biblioteca');c.postMessage({novo:id});c.close()}catch(e){}ok(id)};t.onerror=()=>no(t.error)}})}

/* ---------- cópia de segurança ---------- */
PG.copia=cx=>{cx.innerHTML=`<div class="c"><b>Tudo da Tamaki</b><p class="m">Ficha, cartão, perfil, conversa, diário, notícias e posts com as imagens. Use para trocar de aparelho ou guardar.</p><div class="ab"><button class="b" id="kBx">⬇ Baixar tudo (.json)</button><label class="g">↺ Restaurar tudo<input type="file" id="kAb" accept=".json,application/json" hidden></label></div><p class="m" id="kR"></p></div>
 <div class="c"><b>Só a ficha</b><p class="m">O mesmo arquivo de antes (tamaki-ficha.json).</p><div class="ab"><button class="g" id="fBx">⬇ Baixar ficha</button><label class="g">↺ Restaurar ficha<input type="file" id="fAb" accept=".json,application/json" hidden></label></div></div>`;
 const r=cx.querySelector('#kR');
 cx.querySelector('#kBx').onclick=async()=>{r.textContent='Juntando…';const ms=[];for(const m of msgs){const o=Object.assign({},m);o.imgs=await Promise.all((m.imgs||[]).map(b64));if(m.img)o.img=await b64(m.img);ms.push(o)}baixar(new Blob([JSON.stringify({tipo:'tamaki-tudo',em:Date.now(),ficha:S,msgs:ms})],{type:'application/json'}),'tamaki-tudo-'+new Date().toISOString().slice(0,10)+'.json');r.textContent='Baixado.'};
 cx.querySelector('#kAb').onchange=async e=>{try{r.textContent='Restaurando…';const o=JSON.parse(await e.target.files[0].text());if(o.tipo!='tamaki-tudo')throw 0;S=valida(o.ficha);garante();save();
  for(const m of o.msgs){m.imgs=await Promise.all((m.imgs||[]).map(deB64));if(m.img)m.img=await deB64(m.img);await ZAP.por(m)}msgs=((await ZAP.todas())||[]).sort((a,b)=>a.t-b.t);r.textContent='Restaurado.';topo();desenhaChat()}catch(x){r.textContent='Arquivo inválido.'}};
 cx.querySelector('#fBx').onclick=()=>baixar(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),'tamaki-ficha.json');
 cx.querySelector('#fAb').onchange=async e=>{try{S=valida(JSON.parse(await e.target.files[0].text()));garante();save();topo();toast('Ficha restaurada')}catch(x){toast('Arquivo inválido')}}};

/* ---------- ficha completa (o editor de antes) ---------- */
const lib=src=>new Promise((ok,no)=>{if(document.querySelector(`script[src="${src}"]`))return ok();const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('sem internet para ler este tipo de arquivo'));document.head.appendChild(s)});
const CDN='https://cdnjs.cloudflare.com/ajax/libs/';
// arquivo que não é texto (zip, áudio, imagem…) não entra nas respostas dela
const pareceTexto=t=>{if(!t)return false;const a=t.slice(0,4000),ruim=(a.match(/[\uFFFD\u0000-\u0008\u000E-\u001F]/g)||[]).length;return ruim/a.length<.02};
async function extrair(f){const ext=(f.name.split('.').pop()||'').toLowerCase();
  if(/^(zip|rar|7z|gz|tar|wav|mp3|ogg|m4a|flac|png|jpe?g|webp|gif|mp4|webm|onnx|pt|pth|bin|safetensors|ckpt|exe|apk)$/.test(ext))return {texto:'',info:'arquivo guardado, mas não é de texto: não entra nas respostas dela'};
  if(ext=='pdf'){await lib(CDN+'pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc=CDN+'pdf.js/3.11.174/pdf.worker.min.js';
    const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,out=[];for(let i=1;i<=pdf.numPages;i++){const c=await(await pdf.getPage(i)).getTextContent();out.push(c.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join(''))}return {texto:out.join('\n\n').replace(/[ \t]+\n/g,'\n').trim(),info:pdf.numPages+(pdf.numPages==1?' página':' páginas')}}
  if(ext=='docx'){await lib(CDN+'mammoth/1.6.0/mammoth.browser.min.js');return {texto:(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value.trim()}}
  if(ext=='doc'){// Word antigo: pega os trechos de texto legível do arquivo (aproximado)
    const u=new Uint8Array(await f.arrayBuffer()),comum=/[a-záàâãéêíóôõúç ,.]/gi,parece=t=>(t.match(/\p{L}{3,}/gu)||[]).length>=3&&(t.match(comum)||[]).length/t.length>.8;
    const txt=[new TextDecoder('utf-16le').decode(u),new TextDecoder('windows-1252').decode(u)].map(s=>(s.match(/[A-Za-zÀ-ÿ0-9 .,;:!?()"“”'’\-–—\n\r]{12,}/gu)||[]).filter(parece).join('\n')).sort((a,b)=>(b.match(/\p{L}{3,}/gu)||[]).length-(a.match(/\p{L}{3,}/gu)||[]).length)[0];
    return {texto:(txt||'').replace(/\s+\n/g,'\n').trim(),info:'texto aproximado (Word antigo). Se ficar estranho, salve como .docx ou .pdf'}}
  const t=(await f.text()).trim();return pareceTexto(t)?{texto:t}:{texto:'',info:'não parece texto: não entra nas respostas dela'}}
async function adicionar(fs){for(const f of fs){toast('Lendo '+f.name+'…');const d={id:uid(),nome:f.name,tipo:f.type,tamanho:f.size,blob:f,usar:1,criado:Date.now(),texto:'',info:''};
  try{Object.assign(d,await extrair(f))}catch(e){d.info='não consegui ler o texto ('+e.message+'); o arquivo ficou guardado'}
  try{await DOCS.por(d)}catch(e){toast('Sem espaço para guardar '+f.name);continue}}await listar();toast(fs.length==1?'Documento guardado':fs.length+' documentos guardados');desenhaPgs()}
const kb=n=>n>1e6?(n/1e6).toFixed(1)+' MB':Math.ceil(n/1e3)+' KB',palavras=t=>t?t.split(/\s+/).length:0;
let tab='0',aberto=null;
function dv(){return `<div class="c"><b>Documentos da Tamaki</b><p class="m">Guarde aqui roteiros, histórias e anotações sobre ela (.pdf, .docx, .doc, .txt). Ficam só neste aparelho. Os marcados com “Usar” entram nas respostas dela, no prompt e no “Colocar nas palavras da Tamaki” da Escrita.</p>
  <div class="ab" style="margin-top:10px"><label class="b">＋ Adicionar documentos<input type="file" hidden multiple accept=".pdf,.doc,.docx,.txt,.md,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain" onchange="adicionar([...this.files]);this.value=''"></label></div></div>
  <div class="c">${docs.length?docs.map(d=>`<div class="doc"><span class="ic2">${/pdf$/i.test(d.nome)?'📕':/docx?$/i.test(d.nome)?'📘':'📄'}</span><div><b>${esc(d.nome)}</b><span class="m">${kb(d.tamanho)} · ${palavras(d.texto)} palavras${d.info?' · '+esc(d.info):''}</span></div>
    <div class="ab"><label><input type="checkbox" ${d.usar?'checked':''} onchange="DU('${d.id}',this.checked)"> Usar</label><button class="g" onclick="DV('${d.id}')">Ver texto</button><button class="g" onclick="DA('${d.id}')">Abrir</button><button class="g" onclick="DX('${d.id}',this)">Remover</button></div>${aberto==d.id?`<pre>${esc(d.texto||'(sem texto)')}</pre>`:''}</div>`).join(''):'<p class="m">Nenhum documento ainda.</p>'}</div>`}
window.adicionar=adicionar;
window.DU=async(id,v)=>{const d=docs.find(x=>x.id==id);d.usar=v?1:0;await DOCS.por(d);toast('Salvo')};
window.DV=id=>{aberto=aberto==id?null:id;desenhaPgs()};
window.DA=id=>{const d=docs.find(x=>x.id==id);window.open(URL.createObjectURL(d.blob),'_blank')||baixar(d.blob,d.nome)};
window.DX=async(id,b)=>{if(!b.dataset.s){b.dataset.s=1;b.textContent='Toque de novo para remover';return}await DOCS.tirar(id);await listar();desenhaPgs()};
function mv(i){const m=S.mods[i];return `<div class="c">${m.id=='cartao'?'<p class="m" style="margin:0 0 10px">Este módulo também aparece, mais bonito, em Perfil › Cartão.</p>':''}<input class="ti" data-w="t" data-m="${i}" value="${esc(m.t)}" oninput="E(this)" aria-label="Nome do módulo">`+m.f.map((x,j)=>`<div class="r"><input class="lb" data-w="f" data-m="${i}" data-f="${j}" data-p="0" value="${esc(x[0])}" oninput="E(this)" aria-label="Nome do campo"><button class="x" onclick="A('delf',${i},${j})" aria-label="Remover campo">×</button><textarea data-w="f" data-m="${i}" data-f="${j}" data-p="1" oninput="E(this)" aria-label="${esc(x[0])}">${esc(x[1])}</textarea></div>`).join('')+`<div class="ab"><button class="b" onclick="A('addf',${i})">+ Campo</button><label><input type="checkbox" data-w="i" data-m="${i}" ${m.inc?'checked':''} onchange="E(this)"> Incluir no prompt</label>${m.id=='cartao'?'':`<button class="g" onclick="A('delm',${i},this)">Excluir módulo</button>`}</div></div>`}
function lv(){return `<div class="c"><p class="m" style="margin:0 0 10px">Ferramentas do projeto. As redes dela ficam em Perfil › Redes.</p>`+S.links.map((l,j)=>`<div class="r"><input class="lb" data-w="l" data-l="${j}" data-p="n" value="${esc(l.n)}" oninput="E(this)" aria-label="Nome"><button class="x" onclick="A('dell',${j})" aria-label="Remover link">×</button><input class="f" data-w="l" data-l="${j}" data-p="u" value="${esc(l.u)}" placeholder="https://" oninput="E(this)" aria-label="Endereço"><input class="f" data-w="l" data-l="${j}" data-p="d" value="${esc(l.d)}" placeholder="Para que serve" oninput="E(this)" aria-label="Uso">${/^https?:\/\//i.test(l.u)?`<a href="${esc(l.u)}" target="_blank" rel="noopener noreferrer">Abrir ${esc(l.n)}</a>`:''}</div>`).join('')+`<div class="ab"><button class="b" onclick="A('addl')">+ Link</button></div></div>`}
function pv(){return `<div class="dlg"><textarea id="pr" readonly aria-label="Prompt da Tamaki">${esc(prompt())}</textarea></div><div class="ab"><button class="b" onclick="cp(document.getElementById('pr').value)">Copiar prompt</button><span>Módulos desmarcados e documentos sem “Usar” ficam de fora.</span></div>`}
PG.ficha=cx=>{if(tab!='L'&&tab!='P'&&tab!='D'&&!S.mods[tab])tab=S.mods.length?'0':'L';
 cx.innerHTML=(!S.v?`<div class="c aviso"><b>Ficha resumida disponível</b><p class="m">Deixei as características dela mais curtas e diretas. Quer trocar? A sua versão atual fica guardada como cópia.</p><div class="ab" style="margin-top:10px"><button class="b" onclick="RES(1)">Usar a resumida</button><button class="g" onclick="RES(0)">Manter a minha</button></div></div>`:'')
 +`<nav class="fn">${[...S.mods.map((m,i)=>[String(i),m.t]),['D','📄 Documentos'],['L','Links'],['P','Prompt']].map(([k,n])=>`<button class="${k==tab?'on':''}" onclick="A('tab','${k}')">${esc(n)}</button>`).join('')}<button onclick="A('addm')">+ Módulo</button></nav>`
 +(tab=='L'?lv():tab=='P'?pv():tab=='D'?dv():mv(tab))};
const valida=o=>{if(!o||!Array.isArray(o.mods)||!Array.isArray(o.links))throw 0;return o};
window.E=el=>{const d=el.dataset;if(d.w=='f')S.mods[d.m].f[d.f][d.p]=el.value;else if(d.w=='t')S.mods[d.m].t=el.value;else if(d.w=='i')S.mods[d.m].inc=el.checked?1:0;else if(d.w=='l')S.links[d.l][d.p]=el.value;save()};
window.A=(a,i,j)=>{if(a=='tab')tab=i;else if(a=='addf')S.mods[i].f.push(['Novo campo','']);else if(a=='delf')S.mods[i].f.splice(j,1);else if(a=='addm'){S.mods.push({id:'m'+Date.now(),t:'Novo módulo',inc:1,f:[['Campo','']]});tab=String(S.mods.length-1)}else if(a=='delm'){if(!j.dataset.s){j.dataset.s=1;j.textContent='Toque de novo para excluir';return}S.mods.splice(i,1);tab='0'}else if(a=='addl')S.links.push({n:'Novo link',u:'',d:''});else if(a=='dell')S.links.splice(i,1);if(a!='tab'){garante();save()}desenhaPgs()};
window.cp=cp;
// quem já tinha uma ficha salva escolhe se troca pela resumida (a antiga vira cópia)
window.RES=troca=>{if(troca){try{localStorage.setItem('tamaki:c:antes-da-resumida',JSON.stringify({nome:'Ficha antes da versão resumida',em:new Date().toISOString(),json:JSON.stringify(S)}))}catch(e){}const p=S.perfil;S=clone(D);if(p)S.perfil=p}else S.v=2;garante();tab='0';save();desenhaPgs()};

/* ---------- começo ---------- */
(async()=>{try{const t=localStorage.getItem('tamaki');if(t)S=valida(JSON.parse(t))}catch(e){S=clone(D)}
 garante();save();
 try{await listar()}catch(e){}
 try{msgs=((await ZAP.todas())||[]).sort((a,b)=>a.t-b.t)}catch(e){toast('Não consegui abrir a conversa guardada')}
 try{vozes=((await VOZES.todas())||[]).filter(v=>v&&v.id)}catch(e){}
 try{historico=((await IMGS.todas())||[]).sort((a,b)=>a.t-b.t)}catch(e){}
 desenhaModos();topo();desenhaChat()})();
if('serviceWorker'in navigator&&location.protocol.indexOf('http')==0)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
